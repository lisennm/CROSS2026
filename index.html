<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cross du Lycée – Compteur de tours</title>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3e8;--card:#fffdf7;--ink:#12306b;--mute:#5d6f93;--line:#d9d4c3;--acc:#1b3f86;--acc2:#6f9be0;--onacc:#fff;--red:#e0212f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1936;--card:#13264d;--ink:#eef3fb;--mute:#9fb3d6;--line:#2b3f6b;--acc:#7aa5ea;--acc2:#4a7bc8;--onacc:#0b1936;--red:#ff5b68}}
:root[data-theme="dark"]{--bg:#0b1936;--card:#13264d;--ink:#eef3fb;--mute:#9fb3d6;--line:#2b3f6b;--acc:#7aa5ea;--acc2:#4a7bc8;--onacc:#0b1936;--red:#ff5b68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Montserrat,system-ui,sans-serif;max-width:720px;margin-inline:auto;padding:12px 12px 24px}
.hd{position:relative;text-align:center;padding:10px 0 6px}
.lv-deco{position:absolute;left:-12px;top:-6px;width:84px;height:auto}
.lyc{font:700 11px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.hd h1{font:400 clamp(64px,19vw,104px)/.95 'Kaushan Script',cursive;color:var(--acc);margin:4px 0 0;transform:rotate(-3deg)}
.du{display:flex;align-items:center;justify-content:center;gap:12px;font:700 15px Montserrat,sans-serif;letter-spacing:.32em;color:var(--ink)}
.du i{flex:0 1 70px;height:1.5px;background:var(--ink)}
.date{font:800 clamp(20px,6vw,28px) Montserrat,sans-serif;letter-spacing:.06em;color:var(--red);margin-top:6px}
.clock{font:800 40px Montserrat,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);margin-right:auto}
.ctl{align-items:center;margin:10px 0 4px}
button{font:700 15px Montserrat,sans-serif;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button.p{background:var(--red);color:#fff;border-color:var(--red)}
.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:10px 2px;font-size:14px}.tabs .on,.chips .on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}.chips button{padding:6px 12px;white-space:nowrap;flex:none;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:var(--card);border:2px solid var(--line);border-bottom:6px solid var(--acc2);border-radius:16px;padding:12px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;user-select:none;touch-action:manipulation;cursor:pointer}
.tile:active{border-color:var(--red);transform:scale(.98)}
.tile .n{font-weight:800;overflow-wrap:anywhere;padding-right:34px;letter-spacing:.02em}
.tile .c{font:800 56px/1 Montserrat,sans-serif;color:var(--acc)}
.undo{position:absolute;top:6px;right:6px;padding:4px 9px;font-size:14px}
ol{list-style:none;padding:0;margin:0}
li.r{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
li.r .pos{font:800 28px Montserrat,sans-serif;width:38px;color:var(--acc2)}
li.r .nm{flex:1;font-weight:800}
li.r .lp{font:800 28px Montserrat,sans-serif;color:var(--acc)}
li.r:nth-child(1){border-color:var(--red)}li.r:nth-child(1) .pos{color:var(--red)}
textarea{width:100%;min-height:150px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:500 16px Montserrat,sans-serif;padding:10px}
input{font:500 16px Montserrat,sans-serif;width:120px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hint{color:var(--mute);font-size:14px}
.big{text-align:center;padding:3vh 0 2vh}
.km{font:800 min(30vw,170px)/1 Montserrat,sans-serif;color:var(--acc);font-variant-numeric:tabular-nums}
.unit{font:700 min(6vw,28px)/1.2 Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.sub{color:var(--mute);margin-top:10px}
.bar{height:26px;border-radius:14px;background:var(--line);overflow:hidden;margin:0 4px}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .4s}
.goal{text-align:center;font-weight:700;margin:10px 0 18px}
.lv{display:flex;align-items:center;gap:10px;margin-bottom:8px}.lv b{width:62px;font:800 16px Montserrat,sans-serif}
.lv .t{flex:1;height:14px;border-radius:7px;background:var(--line);overflow:hidden}.lv .t i{display:block;height:100%;background:var(--acc2)}
.lv span{width:96px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.ft{text-align:center;margin-top:26px;padding-top:12px;border-top:2px solid var(--acc2);color:var(--ink);font:700 13px Montserrat,sans-serif;letter-spacing:.18em}
.ft span{font:400 22px 'Kaushan Script',cursive;letter-spacing:0;color:var(--acc);margin-left:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="hd">
<svg class="lv-deco" viewBox="0 0 90 120" aria-hidden="true"><path d="M0 8C28 8 52 30 58 62 28 62 6 40 0 8Z" fill="#12306b"/><path d="M62 18C58 46 40 70 12 82 14 52 34 28 62 18Z" fill="#6f9be0"/><path d="M0 70C26 62 44 72 56 96 28 100 8 90 0 70Z" fill="#e0212f"/></svg>
<div class="lyc">Lycée Français Anna de Noailles · Bucarest</div>
<h1>Cross</h1>
<div class="du"><i></i>DU LYCÉE<i></i></div>
<div class="date">16 OCTOBRE 2026</div>
</header>
<div class="row ctl"><div class="clock" id="clock">00:00</div><button class="p" id="go">Démarrer</button><button id="stop" hidden>Arrêter</button><span class="hint" id="rl" style="align-self:center"></span></div>
<div class="tabs"><button data-v="count" class="on">Tours</button><button data-v="rank">Classement</button><button data-v="dist">Distance</button><button data-v="setup">Coureurs</button></div>
<div class="chips" id="chips" aria-label="Niveau"></div>

<section id="count"><div class="grid" id="tiles"></div><p class="hint" id="empty" hidden>Aucun coureur dans ce niveau. Ajoutez les noms dans l'onglet Coureurs.</p></section>
<section id="rank" hidden><ol id="list"></ol><div class="row"><button id="copy">Copier le classement</button></div><p class="hint">À nombre de tours égal, celui qui a fini son dernier tour en premier est devant.</p></section>
<section id="dist" hidden><div class="big"><div class="km" id="km">0</div><div class="unit" id="unit">km parcourus</div><div class="sub" id="sub"></div></div>
<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="bar"><div id="fill"></div></div><p class="goal" id="goal"></p><div id="bylv"></div></section>
<section id="setup" hidden>
<p class="hint" id="sl"></p>
<textarea id="names" placeholder="Emma&#10;Lucas&#10;Nour"></textarea>
<div class="row"><button class="p" id="save">Enregistrer ce niveau</button><button id="reset">Réinitialiser ce niveau</button></div>
<p style="margin-top:14px"><label for="lap" id="lapl">Longueur d'un tour (mètres)</label><br><input id="lap" type="number" min="1" value="500" inputmode="numeric"></p>
<p><label for="goalin">Objectif total (km)</label><br><input id="goalin" type="number" min="1" value="1800" inputmode="numeric"></p>
<p class="hint" id="msg"></p>
</section>

<footer class="ft">150 ANS<span>Anna de Noailles</span></footer>
<script>
var LV=['PS','MS','GS','CP','CE1','CE2','CM1','CM2','6ème','5ème','4ème','3ème','Lycée'];
var S={runners:[],races:{},lapM:500,lapBy:{},goal:1800,cur:'PS'},K='lapcounter-v2',V='count';
function $(i){return document.getElementById(i)}
function load(){try{var t=localStorage.getItem(K);if(t)S=JSON.parse(t)}catch(e){}
if(!S.lapM)S.lapM=500;if(!S.goal)S.goal=1800;if(!S.races)S.races={};if(!S.lapBy)S.lapBy={};if(LV.indexOf(S.cur)<0)S.cur=LV[0];
S.runners.forEach(function(r){if(!r.level)r.level=LV[0]})}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function race(){return S.races[S.cur]||(S.races[S.cur]={start:null,end:null})}
function fmt(ms){var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function nf(x,d){return x.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:d})}
function dist(m){return m<1000?nf(m,0)+' m':nf(m/1000,2)+' km'}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ofLevel(l){var o=[];S.runners.forEach(function(r,i){if(r.level===l)o.push({r:r,i:i})});return o}
function lapOf(l){return S.lapBy[l]||S.lapM}
function lapsOf(l){return ofLevel(l).reduce(function(a,x){return a+x.r.laps.length},0)}
function tick(){var q=race(),e=q.start?(q.end||Date.now())-q.start:0;$('clock').textContent=fmt(e);$('rl').textContent='Course '+S.cur;
$('go').hidden=!!q.start&&!q.end;$('stop').hidden=!q.start||!!q.end;$('go').textContent=q.end?'Reprendre':'Démarrer'}
function render(){
$('chips').innerHTML=LV.map(function(l){return '<button data-l="'+l+'" class="'+(l===S.cur?'on':'')+'">'+l+' ('+ofLevel(l).length+')</button>'}).join('');
$('chips').hidden=V==='dist';
var cur=ofLevel(S.cur);
$('empty').hidden=cur.length>0;
$('tiles').innerHTML=cur.map(function(x){return '<div class="tile" role="button" tabindex="0" data-i="'+x.i+'"><button class="undo" data-u="'+x.i+'" aria-label="Retirer un tour pour '+esc(x.r.name)+'">-1</button><span class="n">'+esc(x.r.name)+'</span><span class="c">'+x.r.laps.length+'</span></div>'}).join('');
$('list').innerHTML=order().map(function(r,i){return '<li class="r"><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(r.name)+'<br><span class="hint">'+dist(r.laps.length*lapOf(S.cur))+'</span></span><span class="lp">'+r.laps.length+'</span></li>'}).join('');
var laps=S.runners.reduce(function(a,r){return a+r.laps.length},0),m=LV.reduce(function(a,l){return a+lapsOf(l)*lapOf(l)},0);
$('km').textContent=m<1000?nf(m,0):nf(m/1000,2);$('unit').textContent=m<1000?'mètres parcourus':'km parcourus';
var pct=Math.min(100,m/1000/S.goal*100);$('fill').style.width=pct+'%';$('bar').setAttribute('aria-valuenow',Math.round(pct));
$('goal').textContent=(m/1000>=S.goal?'Objectif atteint ! ':nf(pct,1)+' % de l\'objectif · ')+'objectif '+nf(S.goal,0)+' km'+(m/1000<S.goal?' · encore '+nf(S.goal-m/1000,2)+' km':'');
$('sub').textContent=laps+' tours · '+S.runners.length+' coureurs · '+LV.filter(function(l){return ofLevel(l).length}).length+' niveaux';
var mx=Math.max.apply(null,LV.map(lapsOf).concat([1]));
$('bylv').innerHTML=LV.filter(function(l){return ofLevel(l).length}).map(function(l){var n=lapsOf(l);return '<div class="lv"><b>'+l+'</b><div class="t"><i style="width:'+(n/mx*100)+'%"></i></div><span>'+dist(n*lapOf(l))+'</span></div>'}).join('');
tick()}
function order(){return ofLevel(S.cur).map(function(x){return x.r}).sort(function(a,b){var d=b.laps.length-a.laps.length;if(d)return d;return (a.laps[a.laps.length-1]||0)-(b.laps[b.laps.length-1]||0)})}
function fillSetup(){$('sl').textContent='Un coureur par ligne (prénom ou dossard) pour le niveau '+S.cur+'.';
$('names').value=ofLevel(S.cur).map(function(x){return x.r.name}).join('\n');$('lap').value=lapOf(S.cur);$('lapl').textContent='Longueur d\'un tour en '+S.cur+' (mètres)';$('goalin').value=S.goal}
$('chips').addEventListener('click',function(e){var b=e.target.closest('[data-l]');if(!b)return;S.cur=b.dataset.l;save();render();if(V==='setup')fillSetup()});
$('tiles').addEventListener('click',function(e){
var u=e.target.closest('[data-u]');
if(u){S.runners[u.dataset.u].laps.pop();save();render();return}
var t=e.target.closest('.tile');if(!t)return;
var q=race();if(!q.start)q.start=Date.now();else if(q.end){q.start+=Date.now()-q.end}q.end=null;
S.runners[t.dataset.i].laps.push(Date.now());save();render();
if(navigator.vibrate)navigator.vibrate(30)});
$('go').onclick=function(){var q=race();if(q.end){q.start+=Date.now()-q.end;q.end=null}else q.start=Date.now();save();tick()};
$('stop').onclick=function(){race().end=Date.now();save();tick()};
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){V=b.dataset.v;
document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
['count','rank','dist','setup'].forEach(function(v){$(v).hidden=v!==V});
if(V==='setup')fillSetup();render()}});
$('save').onclick=function(){var names=$('names').value.split('\n').map(function(x){return x.trim()}).filter(Boolean),old={};
ofLevel(S.cur).forEach(function(x){old[x.r.name]=x.r.laps});
S.runners=S.runners.filter(function(r){return r.level!==S.cur}).concat(names.map(function(n){return{name:n,level:S.cur,laps:old[n]||[]}}));
var lm=parseInt($('lap').value,10);if(lm>0)S.lapBy[S.cur]=lm;var gl=parseFloat($('goalin').value);if(gl>0)S.goal=gl;
save();render();$('msg').textContent=names.length+' coureurs enregistrés en '+S.cur+' · tour = '+lapOf(S.cur)+' m · objectif '+nf(S.goal,0)+' km.'};
var armed=false;
$('reset').onclick=function(){if(!armed){armed=true;$('reset').textContent='Appuyez encore : efface les tours de '+S.cur;
setTimeout(function(){armed=false;$('reset').textContent='Réinitialiser ce niveau'},3000);return}
armed=false;ofLevel(S.cur).forEach(function(x){x.r.laps=[]});S.races[S.cur]={start:null,end:null};save();render();$('reset').textContent='Réinitialiser ce niveau'};
$('copy').onclick=function(){var t='Classement '+S.cur+'\n'+order().map(function(r,i){return (i+1)+'. '+r.name+' - '+r.laps.length+' tours ('+dist(r.laps.length*lapOf(S.cur))+')'}).join('\n');
try{navigator.clipboard.writeText(t);$('copy').textContent='Copié'}catch(e){window.prompt('Copier :',t)}
setTimeout(function(){$('copy').textContent='Copier le classement'},1500)};
load();render();setInterval(tick,500);
</script>
</body>
</html>
